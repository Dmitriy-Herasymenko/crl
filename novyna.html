  <script src="assets/js/news-data.js"></script>
  <script>
    (function () {
      const slug = new URLSearchParams(window.location.search).get('slug');
      const post = NEWS_DATA.find(p => p.slug === slug);

      const contentEl  = document.getElementById('article-content');
      const notFoundEl = document.getElementById('article-not-found');

      if (!post) {
        contentEl.closest('section').querySelector('img').classList.add('hidden');
        contentEl.classList.add('hidden');
        notFoundEl.classList.remove('hidden');
      } else {
        document.title = post.title + ' — Уманська центральна районна лікарня';
        document.getElementById('page-title').textContent = document.title;
        document.getElementById('article-category').textContent = post.category;
        document.getElementById('article-date').textContent = post.date;
        document.getElementById('article-title').textContent = post.title;

        const img = document.getElementById('article-image');
        img.src = post.image;
        img.alt = post.title;

        post.content.forEach(paragraph => {
          const p = document.createElement('p');
          p.innerHTML = paragraph.replace(/\n/g, '<br>');
          contentEl.appendChild(p);
        });
      }
    })();
  </script>
  <script src="assets/js/main.js" defer></script>
